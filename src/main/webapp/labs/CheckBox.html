<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ví dụ truyền dữ liệu CheckBox trong Servlet</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; background: #f1f5f9; display: flex; justify-content: center; }
        .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 400px; }
        h2 { font-size: 18px; margin-bottom: 20px; color: #1e293b; text-align: center; }
        .check-item { margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        input[type="submit"] { margin-top: 15px; width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Slide 32: Chọn môn học</h2>
        <form action="../CheckBoxAction" method="POST">
            <div class="check-item"><input type="checkbox" name="toan" value="on" checked="checked" /> Toán</div>
            <div class="check-item"><input type="checkbox" name="ly" value="on" /> Vật Lý</div>
            <div class="check-item"><input type="checkbox" name="hoa" value="on" /> Hóa Học</div>
            <input type="submit" value="Chọn Môn Học" />
        </form>
        <p style="margin-top: 15px; text-align: center;"><a href="../">&larr; Quay về Menu Chính</a></p>
    </div>
</body>
</html>
