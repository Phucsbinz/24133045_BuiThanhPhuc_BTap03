<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ví dụ Cookie &amp; Session cho Form Login</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; background: #f1f5f9; display: flex; justify-content: center; }
        .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 380px; }
        h2 { font-size: 18px; margin-bottom: 20px; color: #1e293b; text-align: center; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 9px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; }
        input[type="submit"] { margin-top: 10px; width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Slide 80 &amp; 94: Form Đăng Nhập HTML</h2>
        <form action="../login" method="POST">
            <div class="form-group">
                <label>UserName (Tài khoản):</label>
                <input type="text" name="username" placeholder="trung / admin / manager" required />
            </div>
            <div class="form-group">
                <label>Password (Mật khẩu):</label>
                <input type="password" name="password" placeholder="123" required />
            </div>
            <div style="margin-bottom:12px;">
                <label><input type="checkbox" name="remember" value="on"> Nhớ đăng nhập (Cookie)</label>
            </div>
            <input type="submit" value="Login" />
        </form>
        <p style="margin-top: 15px; text-align: center;"><a href="../">&larr; Quay về Menu Chính</a></p>
    </div>
</body>
</html>
